[package]
name = "dwg2gltf"
description = "Convert AutoCAD DWG drawings to glTF 2.0 / GLB, and meshes back to DWG"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "webp"] }
libredwg-sys = { path = "../libredwg-sys" }
libwebp-sys = { version = "0.14.4", default-features = false, features = ["std"], optional = true }
meshopt-rs = { version = "0.1.2", features = ["experimental"] }
serde_json = { version = "1.0.152", features = ["preserve_order"] }
zip = { version = "7.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
default = ["webp"]
# WebP textures for --compress (libwebp, C). Off in the WebAssembly build.
webp = ["dep:libwebp-sys"]
